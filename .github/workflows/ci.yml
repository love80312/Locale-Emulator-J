# ============================================================
# Locale Emulator - Private CI Workflow (Standard x64 Build)
# ============================================================

name: Build Release

on:
  push:
    branches: forme # 支援常見的主分支名稱

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_DIR: ${{ github.workspace }}\

jobs:
  build:
    name: Full Build & Package
    runs-on: windows-latest # 使用最新的 Windows 跑者

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # 確保與你目前的 SDK 版本一致

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ---- 1. 編譯 .NET 組件 (x64) ----
      - name: Restore & Build .NET (x64)
        run: |
          dotnet restore
          dotnet build -c Release --arch x64

      # ---- 2. 編譯 C++ 組件 (x64 & Win32) ----
      # Locale Emulator 仍需要 Win32 組件來注入 32 位元遊戲
      - name: Build C++ Core & Shell (Win32)
        run: |
          msbuild src/Core/LoaderDll/LoaderDll.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:SolutionDir="$env:SOLUTION_DIR" /v:minimal
          msbuild src/Core/LocaleEmulator/LocaleEmulator.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:SolutionDir="$env:SOLUTION_DIR" /v:minimal
          msbuild src/ShellExtension/ShellExtension.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:SolutionDir="$env:SOLUTION_DIR" /v:minimal

      - name: Build C++ Core & Shell (x64)
        run: |
          msbuild src/Core/LoaderDll/LoaderDll.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:SOLUTION_DIR" /v:minimal
          msbuild src/Core/LocaleEmulator/LocaleEmulator.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:SOLUTION_DIR" /v:minimal
          msbuild src/ShellExtension/ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$env:SOLUTION_DIR" /v:minimal

      # ---- 3. 彙整打包 (Assemble) ----
      - name: Assemble Final Package
        shell: pwsh
        run: |
          # 建立輸出目錄
          New-Item -ItemType Directory -Force -Path "Output/LocaleEmulator"
          
          # 發佈 .NET 主程式
          dotnet publish src/LEProc/LEProc.csproj -c Release -r win-x64 --self-contained false -o Output/LocaleEmulator
          dotnet publish src/LEGUI/LEGUI.csproj -c Release -r win-x64 --self-contained false -o Output/LocaleEmulator
          
          # 複製 C++ DLLs (x64)
          Copy-Item src/Core/LoaderDll/x64/Release/LoaderDll.dll Output/LocaleEmulator/ -Force
          Copy-Item src/Core/LocaleEmulator/x64/Release/LocaleEmulator.dll Output/LocaleEmulator/ -Force
          Copy-Item src/ShellExtension/x64/Release/ShellExtension.dll Output/LocaleEmulator/ -Force
          
          Write-Host "Package assembled in Output/LocaleEmulator" -ForegroundColor Green

      # ---- 4. 上傳成品 ----
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: LocaleEmulator-Win10-x64
          path: Output/LocaleEmulator/
          retention-days: 30 # 增加保留時間到 30 天
