# ============================================================
# Locale Emulator - Personal Release Workflow (forme)
# ============================================================

name: Build Release

on:
  push:
    branches: [ "forme" ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_DIR: ${{ github.workspace }}\

jobs:
  build:
    name: Full Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ---- 1. C++ 核心與組件編譯 ----

      - name: Build Core (Win32 Only)
        run: |
          msbuild src/Core/LoaderDll/LoaderDll.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          msbuild src/Core/LocaleEmulator/LocaleEmulator.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          msbuild src/Core/Loader/Loader.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
        shell: pwsh

      - name: Build ShellExtension (Win32 + x64)
        run: |
          msbuild src/ShellExtension/ShellExtension.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          msbuild src/ShellExtension/ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
        shell: pwsh

      # ---- 2. .NET 組件編譯與發佈 ----

      - name: Publish .NET Apps
        run: |
          # 直接發佈到統一的輸出路徑 Build/Release/x86/
          dotnet publish src/LEProc/LEProc.csproj -c Release -o Build/Release/x86/
          dotnet publish src/LEGUI/LEGUI.csproj -c Release -o Build/Release/x86/

      # ---- 3. 彙整最終成品 (Assemble) ----

      - name: Assemble Files
        run: |
          $targetDir = "Build/Release/x86/"
          if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Force -Path $targetDir }
          
          # 複製編譯好的 C++ DLL 到打包目錄
          Copy-Item src/Core/LoaderDll/Release/LoaderDll.dll $targetDir -Force
          Copy-Item src/Core/LocaleEmulator/Release/LocaleEmulator.dll $targetDir -Force
          
          # 如果有語言檔也要帶走
          if (Test-Path "src/LEGUI/Lang") {
              Copy-Item "src/LEGUI/Lang" -Destination $targetDir -Recurse -Force
          }

          Write-Host "打包內容確認：" -ForegroundColor Cyan
          Get-ChildItem $targetDir -Name
        shell: pwsh

      # ---- 4. 上傳成品 ----

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocaleEmulator-Win10-x64-forme
          path: |
            Build/Release/x86/
            src/ShellExtension/x64/Release/ShellExtension.dll
          retention-days: 14
